<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #f4f4f4;
        }
        .header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 2px solid #ddd;
        }
        .header a {
            text-decoration: none;
            color: inherit;
        }
        .site-title {
            font-size: 2.5rem;
            margin: 0;
            color: #222;
        }
        .site-description {
            font-size: 1.2rem;
            color: #666;
            margin-top: 0.5rem;
        }
        .post-list {
            list-style: none;
            padding: 0;
            margin-top: 2rem;
        }
        .post-item {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .post-link {
            text-decoration: none;
            color: #007bff;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .post-date {
            font-size: 0.9rem;
            color: #888;
            margin-top: 0.5rem;
        }
        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: #888;
            padding: 2rem 0;
            border-top: 2px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/">
            <h1 class="site-title">{{ site.title }}</h1>
        </a>
        <p class="site-description">{{ site.description }}</p>
    </div>

    <ul class="post-list">
        {% for post in site.posts %}
            <li class="post-item">
                <a href="{{ post.url | relative_url }}" class="post-link">{{ post.title }}</a>
                <p class="post-date">{{ post.date | date: "%b %d, %Y" }}</p>
            </li>
        {% endfor %}
    </ul>

    <footer class="footer">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
    </footer>
</body>
</html>
